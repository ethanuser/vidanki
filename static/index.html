<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidAnki</title>
<link rel="icon" href="data:,">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <div class="dd" id="blockDD"></div>
  </div>
  <div id="stats" class="stats"></div>
  <div class="head-tools">
    <button id="settingsBtn" class="icon-btn" aria-label="Settings" data-tip="Settings (,)"><i data-icon="settings"></i></button>
    <button id="paletteBtn" class="icon-btn key-btn" aria-label="Search commands" data-tip="Search">⌘K</button>
    <button id="helpBtn" class="icon-btn" aria-label="Keyboard shortcuts" data-tip="Keyboard shortcuts (?)"><i data-icon="help"></i></button>
    <div id="ankiDot" class="anki-dot"></div>
  </div>
</header>

<main>
  <section id="center">
    <div id="itemHead">
      <div class="crumbs" id="crumbs"></div>
      <h1 id="itemTitle">Loading…</h1>
      <div id="itemNote" class="note" hidden></div>
    </div>

    <!-- video player -->
    <div id="player" hidden>
      <div id="stage">
        <!-- the picture and the controls never overlap, so captions stay readable -->
        <div id="picture">
          <video id="video" playsinline preload="metadata"></video>
          <canvas id="glcanvas"></canvas>
          <div id="picFlash" class="pic-flash"></div>
          <div id="endCard" class="overlay-card" hidden>
            <div class="oc-title">Finished?</div>
            <div class="oc-sub" id="endCardSub"></div>
            <div class="row">
              <button class="primary" id="endDone"><i data-icon="check"></i>Mark done</button>
              <button id="endKeep">Keep watching</button>
            </div>
          </div>
        </div>
        <div id="controls">
          <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
          <div class="ctl-row">
            <button id="playBtn" class="icon-btn" aria-label="Play or pause" data-tip="Play or pause (Space)"><i data-icon="play"></i></button>
            <button id="back10" class="icon-btn skip" aria-label="Back 10 seconds" data-tip="Back 10 seconds (J)"><i data-icon="back"></i>10</button>
            <button id="fwd10" class="icon-btn skip" aria-label="Forward 10 seconds" data-tip="Forward 10 seconds (L)">10<i data-icon="forward"></i></button>
            <span id="time" class="time">0:00 / 0:00</span>
            <span class="spacer"></span>
            <div class="dd up" id="rateDD" data-tip="Speed ([ ])"></div>
            <div class="dd up" id="darkDD" data-tip="Picture mode"></div>
            <input type="range" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume" data-tip="Volume (M)">
            <button id="fsBtn" class="icon-btn" aria-label="Fullscreen" data-tip="Fullscreen (F)"><i data-icon="fullscreen"></i></button>
          </div>
        </div>
      </div>
    </div>

    <!-- brick / amboss task -->
    <div id="task" class="panel task" hidden>
      <div class="task-sec">
        <div class="sec-label" id="taskKind">ScholarRx brick</div>
        <p id="taskInstr"></p>
        <a id="brickLink" class="btn primary" target="_blank" rel="noopener">Open brick<i data-icon="external"></i></a>
        <div id="ambossFields" class="fields" hidden>
          <label>Questions done <input type="number" id="ambN" min="0" inputmode="numeric"></label>
          <label>Correct <input type="number" id="ambC" min="0" inputmode="numeric"></label>
          <a id="ambLink" class="btn primary" href="https://next.amboss.com/us/learning" target="_blank" rel="noopener">Open AMBOSS<i data-icon="external"></i></a>
        </div>
      </div>
      <div class="task-sec">
        <div class="sec-label">Time spent</div>
        <div class="timer">
          <span id="timerVal" data-tip="Click to edit">0:00</span>
          <input id="timerEdit" placeholder="m:ss" aria-label="Time spent" data-tip="m:ss, h:mm:ss, or minutes" hidden>
          <button id="timerBtn" class="t-start" aria-label="Start or pause timer"></button>
          <button id="timerEditBtn" class="icon-btn boxed" aria-label="Edit time" data-tip="Edit time"><i data-icon="pencil"></i></button>
          <button id="timerReset" class="icon-btn boxed" aria-label="Reset time" data-tip="Reset time"><i data-icon="reset"></i></button>
        </div>
      </div>
    </div>

    <!-- anki gate: how many cards stand between you and the next video -->
    <div id="gate" class="panel task" hidden>
      <div class="task-sec">
        <div class="hero">
          <div class="hero-num" id="gateNum"></div>
          <div class="hero-text"><div class="hero-title" id="gateText"></div><div class="muted" id="gateFrom"></div></div>
        </div>
        <div id="gateProgress">
          <div class="bar big"><div id="gateBar"></div></div>
          <div class="bar-label"><span id="gateDone"></span><span id="gateLater"></span></div>
        </div>
        <div class="row hero-actions">
          <button class="primary" id="gateOpen">Open Anki</button>
          <button class="primary" id="gateNext" hidden></button>
          <button class="quiet" id="gateSkip">Skip for now</button>
        </div>
      </div>
      <div class="task-sec warn-note" id="gateWarn" hidden></div>
    </div>

    <!-- today's anki (from the queue's Anki row) -->
    <div id="ankiPanel" class="panel task" hidden>
      <div class="task-sec">
        <div class="tiles" id="ankiTiles"></div>
        <div class="row hero-actions">
          <button class="primary" id="ankiOpen">Open Anki</button>
          <button id="ankiRebuild" class="icon-btn boxed" aria-label="Rebuild deck" data-tip="Rebuild deck"><i data-icon="reset"></i></button>
        </div>
      </div>
      <div class="task-sec anki-notes" id="ankiSub"></div>
    </div>

    <div id="actions" class="row actions">
      <button id="prevBtn" data-tip="Previous item (P)"><i data-icon="chevron-left"></i>Prev</button>
      <button class="primary" id="doneBtn">Mark done</button>
      <button id="undoneBtn" hidden>Mark not done</button>
      <button id="nextBtn" data-tip="Next item (N)">Next<i data-icon="chevron-right"></i></button>
    </div>
  </section>

  <aside id="queue">
    <div class="queue-head">
      <span>Queue</span>
      <label class="check"><input type="checkbox" id="hideDone" checked><span></span>Hide Done</label>
    </div>
    <div id="queueList"></div>
    <details id="estDetails" class="est-details">
      <summary><span class="caret"></span>Time breakdown &amp; card tiers</summary>
      <div id="estBody"></div>
    </details>
  </aside>
</main>

<!-- keyboard shortcuts -->
<div id="helpModal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><span>Keyboard shortcuts</span><button class="icon-btn" data-close aria-label="Close" data-tip="Close (Esc)"><i data-icon="x"></i></button></div>
    <table class="keys" id="keysTable"></table>
  </div>
</div>

<!-- settings -->
<div id="settingsModal" class="modal" hidden>
  <div class="modal-box settings-box">
    <div class="modal-head"><span>Settings: <span id="setBlockName"></span></span><button class="icon-btn" data-close aria-label="Close" data-tip="Close (Esc)"><i data-icon="x"></i></button></div>
    <div class="set-body">
      <div class="set-section">Goal</div>
      <div class="set-row">
        <label for="setGoal">Finish by</label>
        <div class="row">
          <button id="goalMinus">−1 d</button>
          <input type="date" id="setGoal">
          <button id="goalPlus">+1 d</button>
        </div>
      </div>
      <div class="set-section">Time per item <span class="muted small">(blank = learned)</span></div>
      <div id="setPins"></div>
      <div class="set-section">Unsuspend</div>
      <div class="tiers" id="setTiers"></div>
      <div class="set-section">Deck</div>
      <div class="tiers" id="setDeck"></div>
      <div class="set-section">Look</div>
      <div class="swatches" id="themePick" role="radiogroup" aria-label="Theme"></div>
      <div class="set-row"><label for="hueSlider">Your own color</label><input type="range" id="hueSlider" min="0" max="359" step="1"></div>
      <div class="set-row"><label>Mode</label><div class="seg" id="modePick" role="radiogroup" aria-label="Mode"></div></div>
      <div class="set-row"><label>Font</label><div class="seg" id="fontPick" role="radiogroup" aria-label="Font"></div></div>
      <div class="set-section">Sound</div>
      <div class="set-row">
        <label class="check"><input type="checkbox" id="soundOn"><span></span>Sound effects</label>
        <input type="range" id="soundVol" min="0" max="1" step="0.05" aria-label="Sound volume" data-tip="Volume">
      </div>
      <div class="set-result" id="setResult"></div>
    </div>
  </div>
</div>

<!-- command palette -->
<div id="palette" class="modal top" hidden>
  <div class="modal-box palette-box">
    <input id="palInput" placeholder="Type a command or item…" autocomplete="off" spellcheck="false">
    <div id="palList" class="pal-list"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="shader.js"></script>
<script src="sound.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
