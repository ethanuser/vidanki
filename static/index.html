<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidAnki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4 2l10 6-10 6z' fill='%236ea8ff'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="logo">▶</span>
    <div class="dd" id="blockDD"></div>
  </div>
  <div id="stats" class="stats"></div>
  <div class="head-tools">
    <button id="settingsBtn" class="ghost" title="Goal date and time estimates (,)">Settings</button>
    <button id="paletteBtn" class="ghost" title="Search commands (⌘K)">⌘K</button>
    <button id="helpBtn" class="ghost" title="Keyboard shortcuts (?)">?</button>
    <div id="ankiDot" class="anki-dot" title=""></div>
  </div>
</header>

<main>
  <section id="center">
    <div id="itemHead">
      <div class="crumbs" id="crumbs"></div>
      <h1 id="itemTitle">Loading…</h1>
      <div id="itemNote" class="note" hidden></div>
    </div>

    <!-- video player -->
    <div id="player" hidden>
      <div id="stage">
        <video id="video" playsinline preload="metadata"></video>
        <canvas id="glcanvas"></canvas>
        <div id="endCard" class="overlay-card" hidden>
          <div class="oc-title">Finished?</div>
          <div class="oc-sub" id="endCardSub"></div>
          <div class="row">
            <button class="primary" id="endDone">Mark done &amp; unsuspend</button>
            <button id="endKeep">Keep watching</button>
          </div>
        </div>
        <div id="controls">
          <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
          <div class="ctl-row">
            <button id="playBtn" title="Play/pause (space)">▶</button>
            <button id="back10" title="Back 10s (j)">−10</button>
            <button id="fwd10" title="Forward 10s (l)">+10</button>
            <span id="time" class="time">0:00 / 0:00</span>
            <span class="spacer"></span>
            <div class="dd up" id="rateDD" title="Speed ([ and ])"></div>
            <div class="dd up" id="darkDD" title="Picture mode"></div>
            <input type="range" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume" title="Volume (m mutes)">
            <button id="fsBtn" title="Fullscreen (f)">⛶</button>
          </div>
        </div>
      </div>
    </div>

    <!-- brick / amboss task -->
    <div id="task" class="panel task" hidden>
      <div class="task-sec">
        <div class="sec-label" id="taskKind">ScholarRx brick</div>
        <p id="taskInstr"></p>
        <a id="brickLink" class="btn primary" target="_blank" rel="noopener">Open brick ↗</a>
        <div id="ambossFields" class="fields" hidden>
          <label>Questions done <input type="number" id="ambN" min="0" inputmode="numeric"></label>
          <label>Correct <input type="number" id="ambC" min="0" inputmode="numeric"></label>
          <a id="ambLink" class="btn primary" href="https://next.amboss.com/us/questions" target="_blank" rel="noopener">Open AMBOSS ↗</a>
        </div>
      </div>
      <div class="task-sec">
        <div class="sec-label">Time spent</div>
        <div class="timer">
          <span id="timerVal" title="Click to edit">0:00</span>
          <input id="timerEdit" placeholder="m:ss or minutes" hidden>
          <button id="timerBtn" class="t-start">Start timer</button>
          <button id="timerEditBtn">Edit</button>
          <button id="timerReset">Reset</button>
        </div>
      </div>
    </div>

    <!-- anki gate -->
    <div id="gate" class="panel" hidden>
      <div class="gate-title">Anki time</div>
      <p id="gateText"></p>
      <div class="bar big"><div id="gateBar"></div></div>
      <p id="gateSub" class="muted"></p>
      <div class="row">
        <button class="primary" id="gateOpen">Open Anki</button>
        <button id="gateNext" hidden></button>
        <button id="gateSkip">Skip, next item anyway</button>
      </div>
    </div>

    <!-- today's anki (from the queue's Anki row) -->
    <div id="ankiPanel" class="panel task" hidden>
      <div class="task-sec">
        <div class="sec-label" id="ankiLabel">In the VidAnki deck</div>
        <table class="anki-table" id="ankiTable"></table>
        <div class="row">
          <button class="primary" id="ankiOpen">Open Anki</button>
          <button id="ankiRebuild" title="Pull in reviews that became due since the deck was built">Rebuild deck</button>
        </div>
      </div>
      <div class="task-sec anki-notes" id="ankiSub"></div>
    </div>

    <div id="actions" class="row actions">
      <button id="prevBtn" title="Previous item (p)">◂ Prev</button>
      <button class="primary" id="doneBtn">Mark done</button>
      <button id="undoneBtn" hidden>Mark not done</button>
      <button id="nextBtn" title="Next item (n)">Next ▸</button>
      <span id="toast" class="toast"></span>
    </div>
  </section>

  <aside id="queue">
    <div class="queue-head">
      <span>Queue</span>
      <label class="check"><input type="checkbox" id="hideDone" checked><span></span>hide done</label>
    </div>
    <div id="queueList"></div>
    <details id="estDetails" class="est-details">
      <summary>Time breakdown &amp; card tiers</summary>
      <div id="estBody"></div>
    </details>
  </aside>
</main>

<!-- keyboard shortcuts -->
<div id="helpModal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><span>Keyboard shortcuts</span><button class="ghost" data-close>✕</button></div>
    <table class="keys" id="keysTable"></table>
  </div>
</div>

<!-- settings -->
<div id="settingsModal" class="modal" hidden>
  <div class="modal-box settings-box">
    <div class="modal-head"><span>Settings · <span id="setBlockName"></span></span><button class="ghost" data-close>✕</button></div>
    <div class="set-body">
      <div class="set-section">Goal</div>
      <div class="set-row">
        <label for="setGoal">Finish by</label>
        <div class="row">
          <button class="ghost" id="goalMinus" title="One day earlier">−1 d</button>
          <input type="date" id="setGoal">
          <button class="ghost" id="goalPlus" title="One day later">+1 d</button>
        </div>
      </div>
      <div class="set-section">Time estimates <span class="muted small">(blank = learned value)</span></div>
      <div id="setPins"></div>
      <div class="set-section">Anki</div>
      <div class="tiers" id="setTiers"></div>
      <div class="set-result" id="setResult"></div>
    </div>
  </div>
</div>

<!-- command palette -->
<div id="palette" class="modal top" hidden>
  <div class="modal-box palette-box">
    <input id="palInput" placeholder="Type a command or item…" autocomplete="off" spellcheck="false">
    <div id="palList" class="pal-list"></div>
  </div>
</div>

<script src="shader.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
